{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password | EcoWatt Energy</title>
  <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
  <link rel="stylesheet" href="{% static 'css/enterprise.css' %}" />
</head>
<body style="background: var(--bg-app); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">

  <div class="card" style="width: 100%; max-width: 440px; padding: 2.5rem; box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon-box" style="width: 48px; height: 48px; margin: 0 auto 1rem auto; background: linear-gradient(135deg, #2563eb, #1d4ed8);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px;">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1 style="font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em;">Set New Password</h1>
      <p style="color: var(--text-secondary); font-size: 0.875rem; margin-top: 0.25rem;">
        Resetting password for <strong>{{ target_user.email|default:target_user.username }}</strong>
      </p>
    </div>

    {% if messages %}
      <div style="margin-bottom: 1.5rem;">
        {% for message in messages %}
          <div class="alert-banner {% if message.tags == 'error' %}alert-banner-error{% else %}alert-banner-success{% endif %}">
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <form method="POST" action="{% url 'reset_password' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" class="form-control" placeholder="At least 6 characters" required />
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter new password" required />
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 0.95rem; margin-top: 0.5rem; background-color: var(--brand-primary);">
        <span>Save New Password & Log In</span>
      </button>
    </form>
  </div>

</body>
</html>
