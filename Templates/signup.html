{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | EcoWatt Energy</title>
  <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
  <link rel="stylesheet" href="{% static 'css/enterprise.css' %}" />
</head>
<body style="background: var(--bg-app); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">

  <div class="card" style="width: 100%; max-width: 480px; padding: 2.5rem; box-shadow: var(--shadow-md);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon-box" style="width: 48px; height: 48px; margin: 0 auto 0.75rem auto;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px;">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.4 19 2c1 2 2 4.1 2 8 0 5.5-4.5 10-10 10Z"></path>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
        </svg>
      </div>
      <h1 style="font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em;">Create your EcoWatt Account</h1>
      <p style="color: var(--text-secondary); font-size: 0.875rem; margin-top: 0.25rem;">Start tracking home energy usage & saving on bills</p>
    </div>

    {% if messages %}
      <div style="margin-bottom: 1.25rem;">
        {% for message in messages %}
          <div class="alert-banner {% if message.tags == 'error' %}alert-banner-error{% else %}alert-banner-success{% endif %}">
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <form method="POST" action="{% url 'signup' %}">
      {% csrf_token %}

      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Jane Doe" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="contact_number">Contact Number</label>
          <input type="text" id="contact_number" name="contact_number" class="form-control" placeholder="e.g. 9876543210" required />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="jane@domain.com" required />
        </div>
      </div>

      <div class="form-group">
        <label for="physical_address">Home / Property Address</label>
        <input type="text" id="physical_address" name="physical_address" class="form-control" placeholder="Street Address, City" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" required />
        </div>
        <div class="form-group">
          <label for="password2">Confirm Password</label>
          <input type="password" id="password2" name="password2" class="form-control" placeholder="Re-enter password" required />
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 0.95rem; margin-top: 0.5rem;">
        <span>Create Account</span>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary);">
      Already have an account? <a href="{% url 'login' %}" style="color: var(--brand-emerald); font-weight: 600; text-decoration: none;">Sign In</a>
    </div>
  </div>

</body>
</html>
