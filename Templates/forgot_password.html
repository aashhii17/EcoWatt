{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | EcoWatt Energy</title>
  <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
  <link rel="stylesheet" href="{% static 'css/enterprise.css' %}" />
</head>
<body style="background: var(--bg-app); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">

  <div class="card" style="width: 100%; max-width: 440px; padding: 2.5rem; box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon-box" style="width: 48px; height: 48px; margin: 0 auto 1rem auto;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px;">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
        </svg>
      </div>
      <h1 style="font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em;">Forgot Password?</h1>
      <p style="color: var(--text-secondary); font-size: 0.875rem; margin-top: 0.25rem;">Enter your registered contact number or email to reset your password.</p>
    </div>

    {% if messages %}
      <div style="margin-bottom: 1.5rem;">
        {% for message in messages %}
          <div class="alert-banner {% if message.tags == 'error' %}alert-banner-error{% else %}alert-banner-success{% endif %}">
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <form method="POST" action="{% url 'forgot_password' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="identifier">Contact Number / Email Address</label>
        <input type="text" id="identifier" name="identifier" class="form-control" placeholder="e.g. 9876543210 or email@domain.com" required />
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 0.95rem; margin-top: 0.5rem;">
        <span>Verify Account & Reset &rarr;</span>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary);">
      Remember your password? <a href="{% url 'login' %}" style="color: var(--brand-emerald); font-weight: 600; text-decoration: none;">Back to Sign In</a>
    </div>
  </div>

</body>
</html>
